<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aptis General 8-Week Masterclass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="bi bi-mortarboard-fill"></i>
                <h2>Aptis Master</h2>
            </div>
            
            <div class="week-selector">
                <p class="section-title">CHỌN TUẦN</p>
                <div class="week-buttons" id="week-buttons">
                    <!-- Rendered dynamically -->
                </div>
            </div>

            <nav class="main-nav">
                <p class="section-title">CHUYÊN MỤC</p>
                <button class="nav-btn active" data-tab="roadmap">
                    <i class="bi bi-map"></i> Lộ trình & Mục tiêu
                </button>
                <button class="nav-btn" data-tab="vocab">
                    <i class="bi bi-book"></i> Thư viện Từ vựng
                </button>
                <button class="nav-btn" data-tab="vocab-learning">
                    <i class="bi bi-joystick"></i> Học Từ vựng
                </button>
                <button class="nav-btn" data-tab="drills">
                    <i class="bi bi-lightning-charge"></i> Bài tập Trắc nghiệm (Drills)
                </button>
                <button class="nav-btn" data-tab="exercises">
                    <i class="bi bi-headphones"></i> Bài tập Kỹ năng
                </button>
            </nav>
            
            <div class="sidebar-footer">
                <p>Tiến độ: <span id="progress-text">Tuần 1</span></p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header" style="display: flex; justify-content: space-between; align-items: center;">
                <div class="header-info">
                    <h1 id="page-title">Lộ trình & Mục tiêu</h1>
                    <p id="page-subtitle">Xem tổng quan kế hoạch học tập của tuần.</p>
                </div>
                <div class="user-profile" id="user-profile" style="display: none; align-items: center; gap: 10px;">
                    <div style="background: var(--primary-light); color: var(--primary); padding: 8px 15px; border-radius: 20px; font-weight: 600;">
                        <i class="bi bi-person-circle"></i> <span id="username-display"></span>
                    </div>
                    <button id="logout-btn" class="nav-btn" style="padding: 8px 12px; margin: 0; background: #fee2e2; color: #ef4444;"><i class="bi bi-box-arrow-right"></i></button>
                </div>
            </header>

            <div class="content-wrapper" id="content-container">
                <!-- Content will be injected here by app.js -->
            </div>
        </main>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="logo" style="justify-content: center; margin-bottom: 20px;">
                <i class="bi bi-mortarboard-fill" style="font-size: 32px; color: var(--primary);"></i>
                <h2 style="font-size: 24px; color: var(--primary);">Aptis Master</h2>
            </div>
            <h3 style="text-align: center; margin-bottom: 10px; color: #1e293b;">Chào mừng quay trở lại!</h3>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 25px; font-size: 14px;">Vui lòng nhập tên của bạn để lưu lại tiến độ học tập.</p>
            <form id="login-form">
                <input type="text" id="username-input" placeholder="Nhập tên của bạn..." required style="width: 100%; padding: 12px 15px; border: 2px solid #e2e8f0; border-radius: 8px; margin-bottom: 20px; font-size: 16px; outline: none; box-sizing: border-box;">
                <button type="submit" style="width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 16px; cursor: pointer; transition: background 0.2s;">Bắt đầu học</button>
            </form>
        </div>
    </div>

    <!-- Data and App Logic -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
